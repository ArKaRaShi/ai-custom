<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Checkout proposal</title>
    <!-- A plain document keeps its own CSS: this stands in for the project's stylesheet. -->
    <style>
      :root {
        --shop-fg: #182026;
        --shop-muted: #5b6b76;
        --shop-bg: #ffffff;
        --shop-surface: #f4f6f8;
        --shop-border: #d7dee4;
        --shop-accent: #0b6b53;
        --shop-accent-fg: #ffffff;
        --shop-radius: 6px;
      }
      body {
        margin: 0;
        padding: 24px;
        background: var(--shop-bg);
        color: var(--shop-fg);
        font: 15px/1.5 "Helvetica Neue", system-ui, sans-serif;
      }
      .shell { max-width: 680px; margin: 0 auto; }
      h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -0.01em; }
      .muted { color: var(--shop-muted); margin: 0 0 20px; }
      .panel { border: 1px solid var(--shop-border); border-radius: var(--shop-radius); overflow: hidden; }
      .row { display: flex; justify-content: space-between; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--shop-border); }
      .row:last-child { border-bottom: 0; }
      .row.total { background: var(--shop-surface); font-weight: 600; }
      .cta { display: inline-flex; align-items: center; gap: 8px; margin-top: 16px; padding: 10px 18px; border: 0; border-radius: var(--shop-radius); background: var(--shop-accent); color: var(--shop-accent-fg); font: inherit; font-weight: 600; cursor: pointer; }
      .cta:focus-visible { outline: 2px solid var(--shop-accent); outline-offset: 3px; }
      .alternatives { display: grid; gap: 10px; margin-top: 24px; grid-template-columns: 1fr; }
      @media (min-width: 640px) { .alternatives { grid-template-columns: 1fr 1fr; } }
      .alternative { text-align: left; padding: 12px 14px; border: 1px solid var(--shop-border); border-radius: var(--shop-radius); background: var(--shop-bg); color: inherit; font: inherit; cursor: pointer; }
      .alternative[aria-pressed="true"] { border-color: var(--shop-accent); box-shadow: inset 0 0 0 1px var(--shop-accent); }
      .alternative:focus-visible { outline: 2px solid var(--shop-accent); outline-offset: 2px; }
      .alternative strong { display: block; margin-bottom: 2px; }
    </style>
  </head>
  <body>
    <main class="shell">
      <h1>Checkout</h1>
      <p class="muted">Three items, one address, card ending 4242.</p>

      <div class="panel">
        <div class="row"><span>Field notes, hardcover</span><span>$32.00</span></div>
        <div class="row"><span>Shipping — standard</span><span>$4.50</span></div>
        <div class="row"><span>Tax</span><span>$3.12</span></div>
        <div class="row total"><span>Total</span><span>$39.62</span></div>
      </div>

      <button class="cta" data-choice="pay">Pay $39.62</button>

      <div class="alternatives">
        <button class="alternative" data-choice="ship-fast" aria-pressed="false">
          <strong>Faster shipping</strong>
          <span>Two days, $9.00 — total $44.12</span>
        </button>
        <button class="alternative" data-choice="save-card" aria-pressed="false">
          <strong>Save this card</strong>
          <span>Remember for next time on this device</span>
        </button>
      </div>
    </main>

    <script>
      // Selection state stays local: only the choice itself is recorded by the frame.
      for (const button of document.querySelectorAll("[data-choice]")) {
        button.addEventListener("click", () => {
          if (button.classList.contains("alternative")) {
            const pressed = button.getAttribute("aria-pressed") === "true";
            button.setAttribute("aria-pressed", pressed ? "false" : "true");
          }
        });
      }
    </script>
  </body>
</html>
