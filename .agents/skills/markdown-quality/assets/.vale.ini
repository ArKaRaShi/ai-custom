# AI-consumed docs (agent skills, AGENTS.md, instructions) — not human-facing prose.
# Readability grade-level and alex tone-policing target a human reader; skipped.
# Kept: spelling/grammar (Vale), wordiness/passive voice (write-good), redundancy/cliché
# (proselint), AI-generated-prose fingerprints (ai-tells), and this skill's own Bloat rules.
StylesPath = .vale/styles
MinAlertLevel = warning
Packages = write-good, proselint, ai-tells
Vocab = Personal

[*.{md,mdx}]
BasedOnStyles = Vale, write-good, proselint, ai-tells, Bloat
Vale.Repetition = YES
