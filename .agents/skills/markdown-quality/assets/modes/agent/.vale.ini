# Agent mode: the reader is a model. Aim: fewest tokens, one literal meaning.
# Checks: Vale spelling and grammar, write-good, Bloat structure rules, and the
# ai-tells rules that cut tokens or ambiguity (padding, filler, hedging,
# pleasantries, puffery, figurative and anthropomorphic wording).
# ai-tells is an allowlist: the package is not in BasedOnStyles, so rules added by a
# package update stay off until listed here. Punctuation and rhetoric rules
# (colons, semicolons, em dashes, tricolons, contrast formulas) are off because
# a model reads them literally and they do not cost meaning.
StylesPath = ../../.vale/styles
MinAlertLevel = warning
Packages = write-good, ai-tells
Vocab = MarkdownQuality

[*.{md,mdx,txt}]
BasedOnStyles = Vale, write-good, Bloat
Vale.Repetition = YES

# Padding and filler
ai-tells.EmptyPadding = YES
ai-tells.EmptyPaddingStacked = YES
ai-tells.FillerPhrases = YES
ai-tells.FillerIntensifier = YES
ai-tells.ParticipialPadding = YES

# Hedging
ai-tells.HedgingPhrases = YES
ai-tells.DefensiveHedges = YES
ai-tells.StackedHedges = YES

# Pleasantries and announcements
ai-tells.ClosingPleasantries = YES
ai-tells.SycophancyMarkers = YES
ai-tells.HollowAcknowledgment = YES
ai-tells.Metacommentary = YES
ai-tells.ConclusionMarkers = YES
ai-tells.OpeningCliches = YES
ai-tells.ExplainerLeads = YES
ai-tells.UnpackExplore = YES

# Puffery and AI vocabulary
ai-tells.PromotionalPuffery = YES
ai-tells.StrategyBuzzwords = YES
ai-tells.OverusedVocabulary = YES
ai-tells.OverusedVocabularyVerbs = YES

