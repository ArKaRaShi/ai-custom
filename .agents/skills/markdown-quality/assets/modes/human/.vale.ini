# Human mode: the reader is a person. Aim: reads like a person wrote it.
# Checks: Vale spelling and grammar, write-good, proselint, and every ai-tells rule.
# Commit and PR text (COMMIT_EDITMSG, *.commit.md|txt, *.pr.md|txt) also gets
# ai-tells-commits. Bloat length limits are off: people read long paragraphs
# when the prose is good.
# ai-tells-commits is vendored from the tbhb/vale-ai-tells v1.37.0 release
# (ai-tells-commits.zip). It is not in the Vale package catalog.
StylesPath = ../../.vale/styles
MinAlertLevel = warning
Packages = write-good, proselint, ai-tells
Vocab = MarkdownQuality

[formats]
COMMIT_EDITMSG = md

[*.{md,mdx,txt}]
BasedOnStyles = Vale, write-good, proselint, ai-tells
Vale.Repetition = YES

# A matching section replaces the one above, so it repeats the full style list.
[{*COMMIT_EDITMSG,*.commit.{md,txt},*.pr.{md,txt}}]
BasedOnStyles = Vale, write-good, proselint, ai-tells, ai-tells-commits
Vale.Repetition = YES
