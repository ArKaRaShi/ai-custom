  advisor: "@advisor-sub-codex"
  free: "@free-free-openrouter"
  payg: "@payg-payg-openrouter"
  tiny: "@tiny-free-local"
  judge: "@judge-payg-openrouter"
  arena-candidate-1: "@arena-candidate-1-sub-anthropic"
  arena-candidate-2: "@arena-candidate-2-sub-codex"
  arena-judge: "@arena-judge-sub-anthropic"
  deepseek: "@deepseek-payg-vercel"
  test: "@test-sub-anthropic"
  default: "@default-sub-anthropic"
  reviewer: "@reviewer-sub-anthropic"
  security-reviewer: "@security-reviewer-sub-codex"
