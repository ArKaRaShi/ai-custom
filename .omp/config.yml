modelRoles:
  smol: google-antigravity/gemini-3.8-flash:auto
  lite: litellm/gemini-2.5-flash
  slow: openai-codex/gpt-5.6-terra:high
  vision: anthropic/claude-sonnet-5:auto
  plan: anthropic/claude-sonnet-5:xhigh
  designer: anthropic/claude-sonnet-5:auto
  commit: openai-codex/gpt-5.6-luna:auto
  task: kimi-code/k3:off
  advisor: google-antigravity/gemini-3.7-flash:auto
  default: anthropic/claude-sonnet-5:xhigh
  free: openrouter/thinkingmachines/inkling-small:free:high
  boilerplate: openrouter/z-ai/glm-5.3-flash:auto
retry:
  fallbackChains:
    smol:
      - kimi-code/k3:low
      - litellm/vertex_ai/zai-org/glm-5-maas
      - openai-codex/gpt-5.6-luna:low
      - google-antigravity/claude-sonnet-4-6:medium
      - anthropic/claude-sonnet-5:low
    commit:
      - google-antigravity/gemini-3.7-flash:auto
    task:
      - openai-codex/gpt-5.6-luna:high
      - anthropic/claude-sonnet-5:auto
      - openai-codex/gpt-5.6-terra:auto
    free:
      - openrouter/thinkingmachines/inkling:free:high
      - openrouter/poolside/laguna-s-2.1:free
      - openrouter/nvidia/nemotron-3-ultra-550b-a55b:free:high
      - openrouter/nex-agi/nex-n2.5-pro:free:high
      - openrouter/google/gemma-4-31b-it:free
      - openrouter/google/gemma-4-26b-a4b-it:free
      - openrouter/poolside/laguna-xs-2.1:free
      - openrouter/nvidia/nemotron-3-super-120b-a12b:free:medium
      - openrouter/cohere/north-mini-code:free
      - openrouter/nvidia/nemotron-3.5-lightning:free
      - openrouter/nex-agi/nex-n2.5-mini:free:high
symbolPreset: nerd
theme:
  dark: dark-catppuccin
setupVersion: 2
statusLine:
  preset: custom
  separator: none
  sessionAccent: true
  transparent: false
  compactThinkingLevel: false
  showHookStatus: true
  leftSegments:
    - model
    - mode
    - collab
    - path
    - git
    - pr
  rightSegments:
    - subagents
    - context_pct
    - cost
    - session_name
  segmentOptions:
    model:
      showThinkingLevel: true
    path:
      abbreviate: true
      maxLength: 40
      stripWorkPrefix: true
    git:
      showBranch: true
      showStaged: true
      showUnstaged: true
      showUntracked: true
  contextLine: embedded
dev:
  autoqaConsent: granted
display:
  cacheMissMarker: true
task:
  showResolvedModelBadge: true
  agentModelOverrides:
    {}
disabledExtensions:
  []
providers:
  tinyModel: lfm2-700m
  tinyModelDevice: default
  tinyModelDtype: default
  memoryModel: online
  webSearchOrder: auto
composer:
  shape: rule
memory:
  backend: mnemopi
browser:
  headless: false
  relay: true
colorBlindMode: false
codexResets:
  autoRedeem: "no"