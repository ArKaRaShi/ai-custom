  vision-sub-anthropic: anthropic/claude-sonnet-5-5:auto
  plan-sub-anthropic: anthropic/claude-sonnet-5-5:xhigh
  designer-sub-anthropic: anthropic/claude-sonnet-5-5:auto
  commit-sub-codex: openai-codex/gpt-6-luna:auto
  advisor-sub-codex: openai-codex/gpt-6-luna:high
  free-free-openrouter: openrouter/qwen/qwen3.8-27b:free
  free-free-openrouter-2: openrouter/thinkingmachines/inkling-small:free
  free-free-openrouter-3: openrouter/thinkingmachines/inkling:free:high
  free-free-openrouter-4: openrouter/nvidia/nemotron-3-ultra-550b-a55b:free:high
  free-free-openrouter-5: openrouter/google/gemma-4-31b-it:free
  free-free-openrouter-6: openrouter/poolside/laguna-s-2.1:free
  free-free-openrouter-7: openrouter/google/gemma-4-26b-a4b-it:free
  payg-payg-openrouter: openrouter/z-ai/glm-5.3-flash:auto
  payg-payg-openrouter-2: openrouter/qwen/qwen3.8-flash:auto
  tiny-free-local: local/lfm2.5-230m
  judge-payg-openrouter: openrouter/~typesafe/jev-latest
  arena-candidate-1-sub-anthropic: anthropic/claude-sonnet-5-5:high
  arena-candidate-2-sub-codex: openai-codex/gpt-6.1-terra:high
  arena-judge-sub-anthropic: anthropic/claude-opus-5-5:medium
  deepseek-payg-vercel: vercel-ai-gateway/deepseek/deepseek-v4.1-flash-1017
  test-sub-anthropic: anthropic/claude-haiku-5-5:high
  test-sub-codex: openai-codex/gpt-6-luna:high
