  reviewer-sub-anthropic: anthropic/claude-sonnet-5-5:high
  security-reviewer-sub-codex: openai-codex/gpt-6.1-sol:high
retry:
  fallbackChains:
    test:
      - "@test-sub-codex"
    smol:
      - "@smol-sub-anthropic"
    commit:
      - "@commit-sub-codex"
    payg:
      - "@payg-payg-openrouter-2"
      - "@payg-payg-openrouter"
    free:
      - "@free-free-openrouter-2"
      - "@free-free-openrouter-3"
      - "@free-free-openrouter-4"
      - "@free-free-openrouter-5"
      - "@free-free-openrouter-6"
      - "@free-free-openrouter-7"
symbolPreset: nerd
theme:
  dark: dark-catppuccin
setupVersion: 3
statusLine:
  preset: custom
  separator: none
  sessionAccent: true
  transparent: false
  compactThinkingLevel: false
  showHookStatus: true
  leftSegments:
    - model
    - mode
    - collab
    - path
    - git
    - pr
  rightSegments:
    - subagents
    - context_pct
    - cost
    - session_name
  segmentOptions:
    model:
      showThinkingLevel: true
    path:
      abbreviate: true
      maxLength: 40
      stripWorkPrefix: true
    git:
      showBranch: true
      showStaged: true
      showUnstaged: true
      showUntracked: true
  contextLine: embedded
dev:
  autoqaConsent: granted
display:
  cacheMissMarker: true
  pinnedAgents: full
  subagentLivePreview: true
  showTokenUsage: true
  showTurnTime: true
task:
  showResolvedModelBadge: true
  enableLsp: true
  agentModelOverrides: {}
  perCallModel: "on"
disabledExtensions:
  - extension-module:bonsai-companion
providers:
  tinyModelDevice: default
  tinyModelDtype: default
composer:
  shape: rule
  tokenRate: true
memory:
  backend: mnemopi
browser:
  headless: false
  relay: true
colorBlindMode: false
codexResets:
  autoRedeem: "no"
disabledProviders: []
defaultThinkingLevel: auto
find:
  enabled: "on"
snapcompact:
  toolResults: true
mnemopi:
  scoping: per-project-tagged
hideThinkingBlock: false
update:
  auto: false